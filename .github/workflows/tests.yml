name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Las pruebas no abren ventanas —el volcado del mapa a PNG usa Java2D en
      # vez de JavaFX justo para esto— pero sí cargan clases de JavaFX, que en
      # Linux necesitan las bibliotecas nativas de GTK.
      - name: Bibliotecas nativas de JavaFX
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libxtst6

      - name: Pasar las pruebas
        run: ./mvnw -B test
